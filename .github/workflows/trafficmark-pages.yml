name: Deploy TrafficMark ML

on:
  push:
    branches:
      - main
    paths:
      - "Personal Projects/TrafficMark/**"
      - ".github/workflows/trafficmark-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trafficmark-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare TrafficMark site
        shell: bash
        run: |
          mkdir -p _site/TrafficMark
          cp -R "Personal Projects/TrafficMark"/. _site/TrafficMark/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=./TrafficMark/">
              <title>TrafficMark ML</title>
            </head>
            <body>
              <a href="./TrafficMark/">Open TrafficMark ML</a>
            </body>
          </html>
          HTML

      - name: Upload TrafficMark site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
